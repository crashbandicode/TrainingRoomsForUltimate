<text x="58.0" y="282.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start">Input Playback</text>
<text x="1220.0" y="282.0" font-size="20" fill="rgb(236,236,232)" text-anchor="end">[ ZR + D-pad Up ]   press A to re-bind</text>
<text x="58.0" y="322.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start">Cycle Player Character</text>
