<text x="56.0" y="650.8" font-size="16" fill="rgb(236,236,232)" text-anchor="start">Hold one button and press the others to set a chord (16 buttons). A chord of one button is allowed.</text>
<text x="56.0" y="675.2" font-size="14" fill="rgb(150,156,170)" text-anchor="start">L/R page   D-pad move   A change / open   B back   X reset page</text>
<text x="48.0" y="116.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start" font-weight="bold">Display &amp; Controls &gt; Controls  &gt;  Button chords</text>
<text x="58.0" y="162.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start">Save State Save</text>
<text x="1220.0" y="162.0" font-size="20" fill="rgb(236,236,232)" text-anchor="end">[ ZL + D-pad Down ]   press A to re-bind</text>
<text x="58.0" y="202.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start">Save State Load</text>
<text x="1220.0" y="202.0" font-size="20" fill="rgb(236,236,232)" text-anchor="end">[ ZL + D-pad Up ]   press A to re-bind</text>
<text x="58.0" y="242.0" font-size="20" fill="rgb(236,236,232)" text-anchor="start">Input Record</text>
