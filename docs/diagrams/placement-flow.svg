<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>Placing fighters: the five pages and the four refusals</title>
  <desc>Plus confirms on any of the five placement pages; A confirms on Preview. A successful change loads the written save once. After recording, loading a placed save is a separate action, not part of every Play.</desc>
  <defs>
    <marker id="go" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#cfd3da"/></marker>
    <marker id="no" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ef6f6c"/></marker>
  </defs>
  <rect width="1280" height="520" fill="#15151a"/>
  <text x="28" y="32" font-size="20" font-weight="bold" fill="#ffffff">Placing fighters: five pages, four refusals</text>
  <text x="28" y="54" font-size="13" fill="#cfd3da">Plus confirms from any of the five pages; A confirms on Preview. Red arrows show when each action can be refused.</text>

  <rect x="28" y="150" width="130" height="64" rx="8" fill="#23232c" stroke="#5b6170"/>
  <text x="93" y="178" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Open</text>
  <text x="93" y="198" font-size="12" text-anchor="middle" fill="#cfd3da">a save, or Record</text>

  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#15151a">
    <rect x="208" y="150" width="120" height="64" rx="8" fill="#ffd166"/><text x="268" y="178">1 Where</text>
    <rect x="358" y="150" width="120" height="64" rx="8" fill="#ffd166"/><text x="418" y="178">2 Spot</text>
    <rect x="508" y="150" width="120" height="64" rx="8" fill="#ffd166"/><text x="568" y="178">3 State</text>
    <rect x="658" y="150" width="120" height="64" rx="8" fill="#ffd166"/><text x="718" y="178">4 Percent</text>
    <rect x="808" y="150" width="120" height="64" rx="8" fill="#ffd166"/><text x="868" y="178">5 Preview</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#15151a">
    <text x="268" y="198">On or Off stage</text>
    <text x="418" y="198">floor hop, crosshair</text>
    <text x="568" y="198">start of each</text>
    <text x="718" y="198">damage of each</text>
    <text x="868" y="198">the fighters as set</text>
  </g>
  <g stroke="#cfd3da" stroke-width="2" fill="none" marker-end="url(#go)">
    <line x1="158" y1="182" x2="206" y2="182"/>
    <line x1="328" y1="182" x2="356" y2="182"/>
    <line x1="478" y1="182" x2="506" y2="182"/>
    <line x1="628" y1="182" x2="656" y2="182"/>
    <line x1="778" y1="182" x2="806" y2="182"/>
    <path d="M928,170 L960,170 L960,128 L988,128"/>
    <path d="M928,194 L960,194 L960,236 L988,236"/>
    <line x1="1101" y1="268" x2="1101" y2="318"/>
    <path d="M1212,128 L1250,128 L1250,344 L1214,344"/>
  </g>

  <rect x="990" y="96" width="222" height="64" rx="8" fill="#23232c" stroke="#7bd88f"/>
  <text x="1101" y="123" font-size="14" font-weight="bold" text-anchor="middle" fill="#7bd88f">Change placement</text>
  <text x="1101" y="143" font-size="12" text-anchor="middle" fill="#cfd3da">write the new placement</text>
  <rect x="990" y="204" width="222" height="64" rx="8" fill="#23232c" stroke="#7bd88f"/>
  <text x="1101" y="231" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7bd88f">Place fighters, then Record</text>
  <text x="1101" y="251" font-size="12" text-anchor="middle" fill="#cfd3da">confirm both starting positions</text>
  <text x="1110" y="293" font-size="12" fill="#cfd3da">Later, if loaded</text>
  <text x="1240" y="187" text-anchor="end" font-size="12" fill="#cfd3da">If written</text>
  <rect x="990" y="320" width="222" height="56" rx="8" fill="#23232c" stroke="#5b6170"/>
  <text x="1101" y="343" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">A placed save loads</text>
  <text x="1101" y="362" font-size="12" text-anchor="middle" fill="#cfd3da">on Load, or Play with start save on</text>

  <g stroke="#ef6f6c" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#no)">
    <line x1="93" y1="214" x2="93" y2="318"/>
    <path d="M1101,96 L1101,76 L700,76 L700,96"/>
    <path d="M990,250 L940,250 L940,300 L800,300 L800,330"/>
    <line x1="1101" y1="376" x2="1101" y2="418"/>
  </g>
  <g font-size="12">
    <rect x="28" y="320" width="330" height="92" rx="8" fill="#2a1d1f" stroke="#ef6f6c"/>
    <text x="42" y="342" font-weight="bold" fill="#ef6f6c">record-place-practice</text>
    <text x="42" y="362" fill="#ffffff">"Stop the practice game to place fighters"</text>
    <text x="42" y="382" fill="#cfd3da">Before the wizard opens:</text>
    <text x="42" y="400" fill="#cfd3da">a practice game is running.</text>

    <rect x="540" y="98" width="330" height="40" rx="8" fill="#2a1d1f" stroke="#ef6f6c"/>
    <text x="554" y="115" font-weight="bold" fill="#ef6f6c">place-save-write · the write failed</text>
    <text x="554" y="131" fill="#ffffff">"Not saved · {save} could not be written"</text>

    <rect x="560" y="332" width="326" height="92" rx="8" fill="#2a1d1f" stroke="#ef6f6c"/>
    <text x="574" y="354" font-weight="bold" fill="#ef6f6c">record-place-start</text>
    <text x="574" y="374" fill="#ffffff">"Not recorded · {fighter} could not start in {state}"</text>
    <text x="574" y="394" fill="#cfd3da">If placement cannot be confirmed, recording does not</text>
    <text x="574" y="412" fill="#cfd3da">start. No take is saved.</text>

    <rect x="900" y="420" width="358" height="76" rx="8" fill="#2a1d1f" stroke="#ef6f6c"/>
    <text x="914" y="442" font-weight="bold" fill="#ef6f6c">record-place-load</text>
    <text x="914" y="462" fill="#ffffff">"Not placed · {fighter} could not start in {state}"</text>
    <text x="914" y="482" fill="#cfd3da">Load refused. Queued playback stops; the save stays.</text>
  </g>
  <text x="28" y="500" font-size="12" fill="#9aa0ab">A diagram from the decisions, the restriction rows and the code, not game footage.</text>
</svg>
